<header class="topbar glass-panel"><button class="icon-btn" id="sidebarToggle" aria-label="Toggle navigation">☰</button><div class="top-title"><small>GlassLedger</small><strong>{{page_title or 'Inventory with a memory.'}}</strong></div><div class="top-actions"><a class="icon-btn" href="{{url_for('notifications.index')}}" aria-label="Notifications">◉</a><span class="avatar">{{current_user.display_name[:1] if current_user.is_authenticated else 'G'}}</span>{% if current_user.is_authenticated %}<form method="post" action="{{url_for('auth.logout')}}" class="inline"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="link-btn" title="Sign out">Sign out</button></form>{% endif %}</div></header>
