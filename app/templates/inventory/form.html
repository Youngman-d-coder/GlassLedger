{% extends 'layouts/base.html' %}{% block content %}<section class="hero"><div><p class="eyebrow">Inventory setup</p><h1>{{'Edit' if item else 'Add'}} Product</h1><p>Names are normalized to GlassLedger standards before saving.</p></div></section><form method="post" class="glass-card form-grid"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Product name<input name="name" required value="{{item.name if item else ''}}" placeholder="e.g. EDTA Tube"></label><label>SKU (optional)<input name="sku" value="{{item.sku if item and item.sku else ''}}"></label><label>Category<select name="category_id" required>{% for c in categories %}<option value="{{c.id}}" {% if item and item.category_id==c.id %}selected{% endif %}>{{c.name}}</option>{% endfor %}</select></label>{% if not item %}<label>Base unit<select name="base_unit_id" required>{% for u in units %}<option value="{{u.id}}">{{u.name}}</option>{% endfor %}</select></label>{% endif %}<label>Critical stock (base units)<input type="number" min="0" name="critical_stock_base" value="{{item.critical_stock_base if item else 0}}"></label><label>Minimum stock (base units)<input type="number" min="0" name="minimum_stock_base" value="{{item.minimum_stock_base if item else 0}}"></label><label>Target stock (base units)<input type="number" min="0" name="target_stock_base" value="{{item.target_stock_base if item else 0}}"></label><label>Expiry warning days<input type="number" min="0" name="expiry_warning_days" value="{{item.expiry_warning_days if item else 30}}"></label><label>Preferred receive unit<select name="preferred_receive_unit_id"><option value="">Use base unit</option>{% for u in units %}<option value="{{u.id}}" {% if item and item.preferred_receive_unit_id==u.id %}selected{% endif %}>{{u.name}}</option>{% endfor %}</select></label><label>Preferred issue unit<select name="preferred_issue_unit_id"><option value="">Use base unit</option>{% for u in units %}<option value="{{u.id}}" {% if item and item.preferred_issue_unit_id==u.id %}selected{% endif %}>{{u.name}}</option>{% endfor %}</select></label><label>Preferred display unit<select name="preferred_display_unit_id"><option value="">Automatic</option>{% for u in units %}<option value="{{u.id}}" {% if item and item.preferred_display_unit_id==u.id %}selected{% endif %}>{{u.name}}</option>{% endfor %}</select></label><label>Preferred requisition unit<select name="preferred_requisition_unit_id"><option value="">Automatic</option>{% for u in units %}<option value="{{u.id}}" {% if item and item.preferred_requisition_unit_id==u.id %}selected{% endif %}>{{u.name}}</option>{% endfor %}</select></label><label class="check"><input type="checkbox" name="expiry_tracking" {% if item and item.expiry_tracking %}checked{% endif %}> Track expiry</label><label class="check"><input type="checkbox" name="batch_tracking" {% if item and item.batch_tracking %}checked{% endif %}> Track batches</label><label class="full">Description<textarea name="description">{{item.description if item and item.description else ''}}</textarea></label><div class="full actions"><button class="btn primary">Save product</button></div></form>{% endblock %}
