{% extends 'layouts/base.html' %}{% block content %}<section class="hero"><div><p class="eyebrow">Reconciliation</p><h1>Physical Count · {{item.name}}</h1><p>System balance: {{balance}} {{item.base_unit.name}}s. Enter what you physically counted; GlassLedger records the difference instead of overwriting history.</p></div></section><form method="post" class="glass-card form-grid"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><label>Physical quantity<input type="number" min="0" name="quantity" required></label><label>Unit<select name="unit_id">{% for p in item.packaging_levels|sort(attribute='base_quantity') %}<option value="{{p.unit.id}}">{{p.unit.name}}</option>{% endfor %}</select></label><label class="full">Reason / notes<textarea name="notes" placeholder="e.g. Monthly physical stock count"></textarea></label><button class="btn primary">Reconcile count</button></form>{% endblock %}
