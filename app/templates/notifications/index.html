{% extends 'layouts/base.html' %}{% block content %}<section class="hero"><div><p class="eyebrow">Signals</p><h1>Notifications</h1></div><form method="post" action="{{url_for('notifications.read_all')}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><button class="btn">Mark all read</button></form></section><section class="glass-card">{% for n in notifications %}<a class="alert-row {{n.level}}" href="{{n.link or '#'}}"><div><b>{{n.title}}</b><span>{{n.message}}</span></div><small>{{n.created_at.strftime('%d %b %H:%M')}}</small></a>{% else %}<p class="muted">No notifications.</p>{% endfor %}</section>{% endblock %}
